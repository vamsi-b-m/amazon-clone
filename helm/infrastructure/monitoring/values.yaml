crds:
  enabled: true

grafana:
  enabled: true

  defaultDashboardsEnabled: true

  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP
    port: 80

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards

    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: false

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      isDefault: false
      editable: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: Loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: service_name
        tracesToMetrics:
          datasourceUid: Prometheus
          spanAttributes:
            - key: service.name
              value: service
        serviceMap:
          datasourceUid: Prometheus
        nodeGraph:
          enabled: true

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"

    users:
      allow_sign_up: false

    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/amazon-clone/amazon-clone-services.json

    unified_alerting:
      enabled: true

prometheus:
  service:
    type: ClusterIP

alertmanager:
  enabled: true

alerting:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

additionalPrometheusRulesMap:
  amazon-clone-alerts:
    groups:
      - name: amazon-clone
        rules:

          # Service has replicas configured but zero available
          - alert: AmazonCloneServiceDown
            expr: |
              kube_deployment_spec_replicas{
                namespace="amazon-clone"
              } > 0
              and
              kube_deployment_status_replicas_available{
                namespace="amazon-clone"
              } == 0
            for: 2m
            labels:
              severity: critical
              service: "{{ $labels.deployment }}"
            annotations:
              summary: "Amazon Clone service is down"
              description: "Service {{ $labels.deployment }} has no available replicas for more than 2 minutes."

          - alert: AmazonClonePodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="amazon-clone"}[10m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Amazon Clone pod is restarting"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted more than 3 times in 10 minutes."

          - alert: AmazonCloneHighCPU
            expr: |
              sum by (pod) (
                rate(container_cpu_usage_seconds_total{
                  namespace="amazon-clone",
                  container!="",
                  container!="POD"
                }[5m])
              ) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Amazon Clone pod has high CPU"
              description: "Pod {{ $labels.pod }} has been using more than 0.8 CPU cores for 5 minutes."
