kube-prometheus-stack:
  crds:
    enabled: false

  grafana:
    enabled: true

  prometheus:
    service:
      type: ClusterIP

  alertmanager:
    enabled: true

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true


alerting:
  enabled: true

  rules:
    - name: amazon-clone-api-gateway-down
      expr: |
        up{service="api-gateway"} == 0
      for: 2m
      severity: critical
      summary: "API Gateway is down"
      description: "The Amazon Clone API Gateway has been unavailable for more than 2 minutes."
