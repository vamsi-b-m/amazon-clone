kube-prometheus-stack:

  crds:
    enabled: false

  grafana:
    enabled: true

    adminUser: admin
    adminPassword: admin

    service:
      type: ClusterIP

    dashboardsConfigMaps:
      amazon-clone: api-gateway-dashboard

  prometheus:
    service:
      type: ClusterIP

    prometheusSpec:
      serviceMonitorSelector:
        matchLabels:
          release: monitoring

      serviceMonitorNamespaceSelector:
        matchNames:
          - monitoring

  alertmanager:
    enabled: true

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true
