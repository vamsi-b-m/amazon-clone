# helm/amazon-clone/values.yaml

# ------ Global -----------------------------------------------------------------
global:
  namespace: amazon-clone

# ------ Image ----------------------------------------------------------------
image:
  repository: 071975552330.dkr.ecr.ap-south-1.amazonaws.com/amazon-clone
  tag: user-service-1.0.0
  pullPolicy: IfNotPresent              # Never for kind (local), always for EKS

# ------ User Service ----------------------------------------------------------------
userService:
  replicas: 1
  port: 3001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"