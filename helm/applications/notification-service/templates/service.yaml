# k8s/user-service/service
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
