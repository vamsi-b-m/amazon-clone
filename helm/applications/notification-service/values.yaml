# helm/amazon-clone/values.yaml

# ------ Global -----------------------------------------------------------------
global:
  namespace: amazon-clone

# ------ Image ----------------------------------------------------------------
image:
  repository: vamsibm36
  tag: 1.0.0
  pullPolicy: Never             # Never for kind (local), always for EKS

# ------ Notification Service ----------------------------------------------------------------
notificationService:
  replicas: 1
  port: 3005
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"