# k8s/order-service/service
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: {{ .Values.orderService.port }}
      targetPort: {{ .Values.orderService.port }}
