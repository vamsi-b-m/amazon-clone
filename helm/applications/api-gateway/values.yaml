# ------ Global -----------------------------------------------------------------
global:
  namespace: amazon-clone

# ------ Image ----------------------------------------------------------------
image:
  repository: vamsibm36
  tag: 1.0.0
  pullPolicy: Never             # Never for kind (local), always for EKS

# ------ API Gateway ----------------------------------------------------------------
apiGateway:
  replicas: 1
  port: 4000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
