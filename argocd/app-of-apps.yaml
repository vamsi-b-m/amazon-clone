apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amazon-clone
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/vamsi-b-m/amazon-clone.git
    targetRevision: dev
    path: argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
