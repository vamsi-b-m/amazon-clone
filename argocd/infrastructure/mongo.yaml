apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongo
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/vamsi-b-m/amazon-clone.git
    targetRevision: dev
    path: helm/infrastructure/mongo
    
    helm:
      valueFiles:
        helm/infrastructure/mongo/values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: amazon-clone

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    syncOptions:
      - CreateNamespace=true