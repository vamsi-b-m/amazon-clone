apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: amazon-clone-dev
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/vamsi-b-m/amazon-clone.git
    targetRevision: dev
    path: helm/amazon-clone

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: amazon-clone

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true