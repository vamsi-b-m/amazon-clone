apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: notification-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vamsi-b-m/amazon-clone.git
    targetRevision: dev
    path: helm/applications/notification-service

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: amazon-clone

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      